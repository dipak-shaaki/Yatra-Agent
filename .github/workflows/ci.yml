name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Importing the app requires a GROQ_API_KEY value; fall back to a
      # placeholder so test collection never hard-fails when the secret is
      # not configured on the repository.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'ci-placeholder' }}

    services:
      # Session tokens, history and rate limiting are Redis-backed; the
      # session/rate-limit tests fail without it.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # .python-version and pyproject require >=3.13; install it explicitly
      # because the runner image only ships an older system Python.
      - name: Set up Python 3.13
        run: uv python install 3.13

      # --frozen fails loudly if uv.lock drifts from pyproject.toml. --no-build
      # stops uv from falling back to executing untrusted setup scripts.
      - name: Install dependencies
        run: uv sync --frozen --no-build

      - name: Lint with ruff
        run: uv run --no-build --locked ruff check .

      - name: Check formatting with ruff
        run: uv run --no-build --locked ruff format --check .

      - name: Type-check with mypy
        run: uv run --no-build --locked mypy

      - name: Compile all Python sources
        run: uv run --no-build --locked python -m compileall -q app scripts eval tests

      - name: Run tests
        run: uv run --no-build --locked pytest tests/ -v

  retrieval-eval:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ci-placeholder
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --no-build

      # The bge-base-en-v1.5 embedding model (~200MB) is downloaded from
      # Hugging Face on first use; cache it so only the first run pays.
      - name: Cache embedding model
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-base-en-v1.5

      - name: Build Chroma index
        run: uv run --no-build --locked python -m scripts.build_index

      - name: Retrieval quality gate
        run: uv run --no-build --locked python -m scripts.eval_retrieval --retriever hybrid
