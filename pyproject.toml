[project]
name = "yatra-agent"
version = "0.1.0"
description = "Agentic RAG assistant for Nepal domestic tourism — hybrid retrieval, Groq function calling, Redis conversation memory."
readme = "README.md"
authors = [
    { name = "dipak-shaaki", email = "shanki.dipak@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "sentence-transformers>=6.0.1",
    "torch",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.uv]
package = false

# CPU-only PyTorch: this project runs on Intel CPUs, so avoid the CUDA wheels
# and their multi-GB NVIDIA dependencies that PyPI ships for Linux by default.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.mypy]
# Scoped to app/ — the importable library. scripts/, eval/ and tests/ are
# thin drivers and harnesses, deliberately left unchecked.
files = ["app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
