[project]
name = "yatra-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dipak-shaaki", email = "shanki.dipak@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "sentence-transformers>=6.0.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
yatra-agent = "yatra_agent:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.uv]
package = false

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[tool.ruff.lint]
ignore = ["BLE001"]